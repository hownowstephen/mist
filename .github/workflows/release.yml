name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # A tag releases only a commit on main that passes the tests.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # no cache restored into a release
      - run: go vet ./...
      - run: go test -race ./...
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
        working-directory: scripts
      - run: node parity.mjs
        working-directory: scripts

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and publish the release
      id-token: write # keyless signing and the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # no cache restored into a release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # goreleaser leaves the release a draft, so the provenance can be attached before
      # publishing makes it immutable.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-checksums: dist/checksums.txt
      - name: attach the provenance and publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$RUNNER_TEMP/mist_${GITHUB_REF_NAME#v}.intoto.jsonl"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/mist_${GITHUB_REF_NAME#v}.intoto.jsonl" -R "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --draft=false -R "$GITHUB_REPOSITORY"
      - name: warm the Go module proxy
        run: curl -fsS "https://proxy.golang.org/github.com/hownowstephen/mist/@v/${GITHUB_REF_NAME}.info"
