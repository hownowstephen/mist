name: Nightly

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Generator seed (defaults to the run ID)
        required: false

permissions:
  contents: read

jobs:
  differential:
    name: generated differential vs liquidjs
    runs-on: ubuntu-latest
    env:
      SEED: ${{ inputs.seed || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund
        working-directory: scripts
      - name: generate 100k templates (seed ${{ env.SEED }})
        run: go run ./scripts/gen -n 100000 -seed "$SEED" > "$RUNNER_TEMP/gen.json"
      - name: liquidjs oracle
        run: node scripts/oracle.mjs -o "$RUNNER_TEMP/oracle.json" "$RUNNER_TEMP/gen.json"
      - name: diff mist against liquidjs
        run: MIST_CORPUS="$RUNNER_TEMP/oracle.json" go test -run TestCorpus -v . | tail -40
        shell: bash -o pipefail {0}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-seed-${{ env.SEED }}
          path: ${{ runner.temp }}/oracle.json

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Keep the inputs fuzzing has found, so each night builds on the last.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-${{ github.run_id }}
          restore-keys: fuzz-
      - run: go test -run '^$' -fuzz FuzzRender -fuzztime 5m .
      - run: go test -run '^$' -fuzz FuzzInvariants -fuzztime 5m .
      # The fuzz targets have no oracle, so liquidjs checks every input they've kept.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund
        working-directory: scripts
      - name: fuzz corpus as oracle input
        run: go run ./scripts/fuzzcases testdata/fuzz "$(go env GOCACHE)/fuzz" > "$RUNNER_TEMP/fuzz.json"
      - name: liquidjs oracle on the fuzz corpus
        run: node scripts/oracle.mjs -o "$RUNNER_TEMP/fuzz-oracle.json" "$RUNNER_TEMP/fuzz.json"
      - name: diff mist against liquidjs on the fuzz corpus
        run: MIST_CORPUS="$RUNNER_TEMP/fuzz-oracle.json" go test -run TestCorpus -v . | tail -40
        shell: bash -o pipefail {0}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: |
            testdata/fuzz
            ${{ runner.temp }}/fuzz-oracle.json

  # liquidjs moves on; this shows what would change if the parity target did.
  # scripts/latest pins the newest liquidjs, which Dependabot keeps current, and drift.txt
  # lists the renders known to differ under it. A change to that list fails the job.
  liquidjs-latest:
    name: differential vs latest liquidjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: install the newest liquidjs in place of the parity target
        run: cp latest/package.json latest/package-lock.json latest/liquidjs-options.json . && npm ci --no-audit --no-fund
        working-directory: scripts
      - run: node -p "'liquidjs ' + require('liquidjs/package.json').version" | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: scripts
      - name: cases.json and corpus.json drift against scripts/latest/drift.txt
        run: |
          scripts/latest/drift.sh > "$RUNNER_TEMP/drift.txt"
          { echo '```diff'; diff -u scripts/latest/drift.txt "$RUNNER_TEMP/drift.txt" && echo 'no change'; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          cmp -s scripts/latest/drift.txt "$RUNNER_TEMP/drift.txt"
      # New templates every night, so no baseline; read alongside drift.txt.
      - name: generated templates (informational)
        if: always()
        continue-on-error: true
        run: |
          go run ./scripts/gen -n 20000 -seed "$GITHUB_RUN_ID" > "$RUNNER_TEMP/gen.json"
          node scripts/oracle.mjs -o "$RUNNER_TEMP/oracle.json" "$RUNNER_TEMP/gen.json"
          MIST_CORPUS="$RUNNER_TEMP/oracle.json" go test -run TestCorpus -v . > "$RUNNER_TEMP/diff.txt"
        shell: bash -o pipefail {0}
      - if: always()
        run: |
          { echo '```'; head -c 900000 "$RUNNER_TEMP/diff.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" # summaries cap at 1 MiB
          cat "$RUNNER_TEMP/diff.txt"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liquidjs-latest-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/drift.txt
            ${{ runner.temp }}/diff.txt
            ${{ runner.temp }}/oracle.json

  report:
    name: open an issue on failure
    needs: [differential, fuzz, liquidjs-latest]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --label nightly --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label nightly --title "Nightly failed" --body "$RUN_URL"
          fi
