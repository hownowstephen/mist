name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Run the matrix version as written, instead of letting go.mod download a newer toolchain.
env:
  GOTOOLCHAIN: local

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The last three Go releases: go.mod's minimum (bump both when a new Go ships), then the two newest.
        go: ["1.25.x", oldstable, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: go mod tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - name: go test (race)
        run: go test -race -shuffle=on ./...
      # A separate run without -race, which adds allocations, so the allocation test runs too.
      - name: go test (coverage, allocation check)
        run: go test -shuffle=on -coverprofile=coverage.out .
      - name: coverage floor
        env:
          MIN_COVERAGE: "99.0"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "coverage: $total% (floor $MIN_COVERAGE%)"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit !(t >= m) }'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: oldstable # golangci-lint v2.14 is built with Go 1.26 and can't read 1.27 packages; back to stable when it can
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          advanced-security: false
          annotations: true

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable
          go-package: ./...

  parity:
    name: liquidjs parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund
        working-directory: scripts
      - run: node parity.mjs
        working-directory: scripts
      - name: benchmark fixtures render as liquidjs does
        run: node bench.mjs -check
        working-directory: scripts
      # These files are regenerated output; a different Node, ICU or liquidjs changes them.
      - name: jscase.json matches this Node
        run: node jscase.mjs -o "$RUNNER_TEMP/jscase.json" && cmp "$RUNNER_TEMP/jscase.json" ../testdata/jscase.json
        working-directory: scripts
      - name: jsdate.json matches this liquidjs
        run: node jsdate.mjs -o "$RUNNER_TEMP/jsdate.json" && cmp "$RUNNER_TEMP/jsdate.json" ../testdata/jsdate.json
        working-directory: scripts
      - name: corpus.json matches the oracle
        run: node oracle.mjs -o "$RUNNER_TEMP/corpus.json" ../testdata/corpus.json && cmp "$RUNNER_TEMP/corpus.json" ../testdata/corpus.json
        working-directory: scripts

  differential:
    name: generated differential vs liquidjs
    runs-on: ubuntu-latest
    env:
      SEED: ${{ github.run_id }} # new templates every run; the seed is in the log to reproduce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund
        working-directory: scripts
      - name: generate 20k templates (seed ${{ env.SEED }})
        run: go run ./scripts/gen -n 20000 -seed "$SEED" > "$RUNNER_TEMP/gen.json"
      - name: liquidjs oracle
        run: node scripts/oracle.mjs -o "$RUNNER_TEMP/oracle.json" "$RUNNER_TEMP/gen.json"
      - name: diff mist against liquidjs
        run: MIST_CORPUS="$RUNNER_TEMP/oracle.json" go test -run TestCorpus -v . | tail -40
        shell: bash -o pipefail {0}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-seed-${{ env.SEED }}
          path: ${{ runner.temp }}/oracle.json

  api:
    name: API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Reports exported API changes since the latest release and the version they call for.
      - name: gorelease
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v*')
          go run golang.org/x/exp/cmd/gorelease@v0.0.0-20260908205506-85c1c2202aba -base="$base" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash -o pipefail {0}
