version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
    ignore:
      # Pinned to the SPEC.md parity target on purpose; moving it is a spec change.
      - dependency-name: liquidjs
