version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a new release age before it becomes a PR
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a new release age before it becomes a PR
  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a new release age before it becomes a PR
    ignore:
      # Pinned to the SPEC.md parity target on purpose; moving it is a spec change.
      - dependency-name: liquidjs
  - package-ecosystem: npm
    directory: /scripts/latest # the newest liquidjs, for the nightly drift job
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a new release age before it becomes a PR
