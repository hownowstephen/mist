version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars

  settings:
    gocritic:
      disabled-checks:
        - argOrder # strings.Contains("set", c) is a deliberate membership test

formatters:
  enable:
    - gofmt
