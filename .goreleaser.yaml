version: 2

builds:
  - id: mistcheck
    main: ./cmd/mistcheck
    binary: mistcheck
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, SPEC.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
